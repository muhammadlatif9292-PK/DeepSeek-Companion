<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DeepSeek Companion King</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="popup">
    <div class="popup-header">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#2f81f7"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span>DeepSeek Companion King</span>
      <span class="version">v3.0.0</span>
    </div>

    <div class="status-row" id="status-row">
      <span class="dot dot-grey"></span>
      <span id="status-text">Not on DeepSeek</span>
    </div>

    <div class="action-grid">
      <button class="action-btn" id="btn-toggle-sidebar">
        <span class="action-icon">◧</span>
        <span>Toggle Sidebar</span>
      </button>
      <button class="action-btn" id="btn-settings">
        <span class="action-icon">⚙</span>
        <span>Settings</span>
      </button>
      <button class="action-btn" id="btn-open-deepseek">
        <span class="action-icon">🌐</span>
        <span>Open DeepSeek</span>
      </button>
      <button class="action-btn" id="btn-help">
        <span class="action-icon">?</span>
        <span>Help</span>
      </button>
    </div>

    <div class="stats" id="stats">
      <div class="stat"><span id="stat-files">0</span><span>Files</span></div>
      <div class="stat"><span id="stat-bookmarks">0</span><span>Bookmarks</span></div>
      <div class="stat"><span id="stat-templates">0</span><span>Templates</span></div>
    </div>

    <div class="powered-by">✨ Powered by Gemini AI</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
