<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DeepSeek Companion Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="popup">
    <div class="popup-header">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <rect x="3" y="3" width="7" height="7" rx="2" fill="#2f81f7"/>
        <rect x="14" y="3" width="7" height="7" rx="2" fill="#2f81f7" opacity="0.7"/>
        <rect x="3" y="14" width="7" height="7" rx="2" fill="#2f81f7" opacity="0.7"/>
        <rect x="14" y="14" width="7" height="7" rx="2" fill="#2f81f7" opacity="0.4"/>
      </svg>
      <div class="header-text">
        <span class="title">DeepSeek Companion</span>
        <span class="subtitle">Pro Edition · v6.0</span>
      </div>
    </div>

    <div class="status-row" id="status-row">
      <span class="dot dot-grey" id="status-dot"></span>
      <span id="status-text">Not on DeepSeek</span>
    </div>

    <div class="action-grid">
      <button class="action-btn primary" id="btn-toggle-sidebar">
        <span class="action-icon">◧</span>
        <span>Open Sidebar</span>
      </button>
      <button class="action-btn" id="btn-open-deepseek">
        <span class="action-icon">🌐</span>
        <span>DeepSeek Chat</span>
      </button>
      <button class="action-btn" id="btn-settings">
        <span class="action-icon">⚙</span>
        <span>Settings</span>
      </button>
      <button class="action-btn" id="btn-help">
        <span class="action-icon">?</span>
        <span>Help</span>
      </button>
    </div>

    <div class="stats-row" id="stats">
      <div class="stat">
        <span class="stat-val" id="stat-vault-files">0</span>
        <span class="stat-lbl">Vault Files</span>
      </div>
      <div class="stat-div"></div>
      <div class="stat">
        <span class="stat-val" id="stat-exports">0</span>
        <span class="stat-lbl">Exports</span>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
